apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      version: green
  template:
    metadata:
      labels:
        app: bg-app
        version: green
    spec:
      containers:
      - name: bg-app
        image: kp6969/bg-demo-app:green
        ports:
        - containerPort: 80
