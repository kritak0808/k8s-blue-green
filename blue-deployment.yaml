apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      version: blue
  template:
    metadata:
      labels:
        app: bg-app
        version: blue
    spec:
      containers:
      - name: bg-app
        image: kp6969/bg-demo-app:blue
        ports:
        - containerPort: 80
